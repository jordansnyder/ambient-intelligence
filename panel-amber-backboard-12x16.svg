<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="304.8mm" height="450mm"
     viewBox="0 -5 304.8 455"
     style="background: transparent;">

  <!-- ============================================ -->
  <!-- AMBER ACRYLIC BACKBOARD — 12" × 16"          -->
  <!-- 304.8mm × 406.4mm                             -->
  <!-- Material: Amber/tinted 3/16" (4.76mm) acrylic   -->
  <!-- Wall-mounted. Devices mount directly to this.  -->
  <!-- SCALE: 1:1 — 1 viewBox unit = 1mm             -->
  <!-- ============================================ -->
  <!-- LAYER: CUT (RED #FF0000) — Through-cut only    -->
  <!-- Simplified — no decorative etching.             -->
  <!-- ============================================ -->


  <!-- === CUT LAYER (RED #FF0000) === -->
  <g id="CUT" fill="none" stroke="#FF0000" stroke-width="0.1">

    <!-- Outer panel boundary — rounded corners -->
    <rect x="0" y="0" width="304.8" height="406.4" rx="5" ry="5"/>

    <!-- Corner wall-mounting holes (M4 = 4.2mm drill) -->
    <circle cx="12" cy="12" r="2.1"/>
    <circle cx="292.8" cy="12" r="2.1"/>
    <circle cx="12" cy="394.4" r="2.1"/>
    <circle cx="292.8" cy="394.4" r="2.1"/>

    <!-- Mid-edge wall-mounting holes (top/bottom center) -->
    <circle cx="152.4" cy="12" r="2.1"/>
    <circle cx="152.4" cy="394.4" r="2.1"/>

    <!-- ============================================ -->
    <!-- STANDOFF HOLES FOR SMOKED COVER PANEL (M3)  -->
    <!-- Cover panel is 304.8 x 345mm, top-aligned    -->
    <!-- These holes align with the cover's corners    -->
    <!-- ============================================ -->

    <!-- Cover panel corner standoffs (20mm inset — clears wall-mount holes) -->
    <circle cx="20" cy="20" r="1.6"/>
    <circle cx="284.8" cy="20" r="1.6"/>
    <circle cx="20" cy="325" r="1.6"/>
    <circle cx="284.8" cy="325" r="1.6"/>

    <!-- Cover panel mid-edge standoffs (for rigidity) -->
    <circle cx="152.4" cy="20" r="1.6"/>
    <circle cx="152.4" cy="325" r="1.6"/>
    <circle cx="20" cy="172.5" r="1.6"/>
    <circle cx="284.8" cy="172.5" r="1.6"/>

    <!-- Center standoff -->
    <circle cx="152.4" cy="172.5" r="1.6"/>

    <!-- ============================================ -->
    <!-- BADGE MOUNTING HOLES (M3, with standoffs)    -->
    <!-- Badge: 254 x 51mm, centered at bottom        -->
    <!-- Badge left edge at x=25.4 ((304.8-254)/2)    -->
    <!-- Badge top edge at y=355.4 (345 + 10mm gap)   -->
    <!-- Badge bottom edge at y=406.4                  -->
    <!-- Holes match badge standoff holes (8mm inset)  -->
    <!-- ============================================ -->

    <!-- Badge standoff holes (4 corners, symmetric) -->
    <circle cx="33.4" cy="363.4" r="1.6"/>
    <circle cx="271.4" cy="363.4" r="1.6"/>
    <circle cx="33.4" cy="398.4" r="1.6"/>
    <circle cx="271.4" cy="398.4" r="1.6"/>

    <!-- Ventilation slots (top edge, for convective airflow) -->
    <rect x="80" y="2" width="20" height="4" rx="1"/>
    <rect x="142.4" y="2" width="20" height="4" rx="1"/>
    <rect x="204.8" y="2" width="20" height="4" rx="1"/>

    <!-- Cable routing slots (below cover panel zone) -->
    <rect x="60" y="343" width="25" height="5" rx="1.5"/>
    <rect x="140" y="343" width="25" height="5" rx="1.5"/>
    <rect x="220" y="343" width="25" height="5" rx="1.5"/>

  </g>


  <!-- === CALIBRATION REFERENCE (below cut boundary, 10mm gap) === -->
  <g fill="none" stroke="#00AA00" stroke-width="0.15" font-family="'Courier New', monospace">
    <!-- 1" × 1" calibration square (25.4mm × 25.4mm) -->
    <rect x="10" y="416.4" width="25.4" height="25.4"/>
    <text x="10" y="413" fill="#00AA00" font-size="2.5" letter-spacing="0.3">CALIBRATION: 1 INCH = 25.4mm</text>
    <text x="40" y="428" fill="#00AA00" font-size="2" letter-spacing="0.2">SCALE 1:1 — 1 unit = 1mm</text>
    <text x="40" y="434" fill="#00AA00" font-size="2" letter-spacing="0.2">AMBER BACKBOARD | 3/16" (4.76mm) ACRYLIC | 304.8 × 406.4mm (12" × 16")</text>
    <text x="40" y="440" fill="#00AA00" font-size="2" letter-spacing="0.2">DEVICES MOUNT DIRECTLY — ARTISTS DRILL OWN HOLES</text>
  </g>

</svg>

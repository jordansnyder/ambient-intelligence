<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="280mm" height="77mm"
     viewBox="-13 -13 280 77"
     style="background: transparent;">

  <!-- ============================================ -->
  <!-- BLACK ACRYLIC BADGE / NAMETAG                 -->
  <!-- 254mm × 51mm (10" × 2")                       -->
  <!-- Material: Black 3mm acrylic                    -->
  <!-- Left-aligned on amber backboard, bottom zone   -->
  <!-- Mounted with M3 standoffs for depth/pop        -->
  <!-- SCALE: 1:1 — 1 viewBox unit = 1mm             -->
  <!-- ============================================ -->
  <!-- LAYER: CUT (RED #FF0000) — Through-cut         -->
  <!-- LAYER: ETCH-DEEP (BLUE #0000FF) — Deep engrave -->
  <!-- ============================================ -->
  <!--                                                 -->
  <!-- OLED MODULE: BuyDisplay ER-OLEDM032-1Y          -->
  <!-- Module outline: 100.5mm × 33.5mm × 6.3mm       -->
  <!-- Active area: 76.78mm × 19.18mm                  -->
  <!-- Visual area: 78.78mm × 21.18mm                  -->
  <!-- Controller: SSD1322, SPI interface              -->
  <!-- Display color: Yellow on black                  -->
  <!-- Resolution: 256 × 64 pixels                    -->
  <!-- Connector: Pin header (1x20, 2.54mm pitch)     -->
  <!-- ============================================ -->


  <!-- === CUT LAYER (RED #FF0000) === -->
  <g id="CUT" fill="none" stroke="#FF0000" stroke-width="0.1">

    <!-- Outer badge boundary — rounded corners -->
    <rect x="0" y="0" width="254" height="51" rx="3" ry="3"/>

    <!-- ============================================ -->
    <!-- OLED DISPLAY WINDOW                           -->
    <!-- Module centered vertically in badge           -->
    <!-- Left edge of module at x=8mm (inset from edge)-->
    <!-- Module center Y = 25.5mm (badge center)       -->
    <!-- Display window = visual area with 1mm margin  -->
    <!-- ============================================ -->

    <!-- OLED visual area cutout (window to see display through) -->
    <!-- Visual area: 78.78 x 21.18mm                            -->
    <!-- Positioned: module left edge at x=8,                    -->
    <!-- visual area centered on module (100.5-78.78)/2 = 10.86  -->
    <!-- So visual area left = 8 + 10.86 = 18.86                -->
    <!-- Visual area top = (51-21.18)/2 = 14.91                  -->
    <rect x="18.86" y="14.91" width="78.78" height="21.18" rx="1.5"/>

    <!-- OLED module mounting holes (M2, 2.2mm diameter)   -->
    <!-- Approximate positions — verify against datasheet! -->
    <!-- Module corners, inset ~3mm from module edges       -->
    <!-- Module positioned: x=8 to x=108.5, y=8.75 to y=42.25 -->
    <circle cx="12" cy="12" r="1.1"/>
    <circle cx="105" cy="12" r="1.1"/>
    <circle cx="12" cy="39" r="1.1"/>
    <circle cx="105" cy="39" r="1.1"/>

    <!-- Pin header cable slot (bottom of OLED module area) -->
    <!-- For ribbon cable / pin header to pass through      -->
    <rect x="30" y="43" width="55" height="5" rx="1"/>

    <!-- Badge-to-backboard standoff holes (M3 = 3.2mm)     -->
    <!-- These align with the backboard's badge mount holes  -->
    <!-- Backboard holes at: (20,363), (258,363), (20,399), (258,399) -->
    <!-- Badge local coords: badge x=12 on backboard         -->
    <!-- So badge hole x = backboard_x - 12                  -->
    <circle cx="8" cy="8" r="1.6"/>
    <circle cx="246" cy="8" r="1.6"/>
    <circle cx="8" cy="43" r="1.6"/>
    <circle cx="246" cy="43" r="1.6"/>

  </g>


  <!-- === ETCH-DEEP LAYER (BLUE #0000FF) — Badge Text === -->
  <g id="ETCH-DEEP" fill="#0000FF" stroke="none" font-family="'Courier New', monospace">

    <!-- The etch will show as lighter text on black acrylic -->

    <!-- Specimen catalog ID (right of OLED window) -->
    <text x="115" y="20" font-size="4.5" letter-spacing="0.8">ARC-2026-AI-___</text>

    <!-- Artist / specimen info -->
    <text x="115" y="28" font-size="2.5" letter-spacing="0.4" opacity="0.7">SPECIMEN: _______________</text>
    <text x="115" y="34" font-size="2.5" letter-spacing="0.4" opacity="0.7">ARTIST: _________________</text>

    <!-- Network info (smaller) -->
    <text x="115" y="42" font-size="2" letter-spacing="0.3" opacity="0.5">NODE: AI-___ | MAESTRA NETWORK | ΣΩ-ACTIVE</text>

    <!-- Decorative separator between OLED zone and text -->
    <line x1="110" y1="12" x2="110" y2="43" stroke="#0000FF" stroke-width="0.15" opacity="0.4"/>

    <!-- Corner registration marks -->
    <line x1="1" y1="4" x2="1" y2="1" stroke="#0000FF" stroke-width="0.12"/>
    <line x1="1" y1="1" x2="4" y2="1" stroke="#0000FF" stroke-width="0.12"/>

    <line x1="250" y1="1" x2="253" y2="1" stroke="#0000FF" stroke-width="0.12"/>
    <line x1="253" y1="1" x2="253" y2="4" stroke="#0000FF" stroke-width="0.12"/>

    <line x1="1" y1="47" x2="1" y2="50" stroke="#0000FF" stroke-width="0.12"/>
    <line x1="1" y1="50" x2="4" y2="50" stroke="#0000FF" stroke-width="0.12"/>

    <line x1="253" y1="47" x2="253" y2="50" stroke="#0000FF" stroke-width="0.12"/>
    <line x1="250" y1="50" x2="253" y2="50" stroke="#0000FF" stroke-width="0.12"/>

  </g>


  <!-- === CALIBRATION REFERENCE (outside cut boundary) === -->
  <g fill="none" stroke="#00AA00" stroke-width="0.15" font-family="'Courier New', monospace">
    <!-- 1" × 1" calibration square (25.4mm × 25.4mm) -->
    <rect x="-12" y="-12" width="25.4" height="25.4"/>
    <text x="-12" y="-14" fill="#00AA00" font-size="2" letter-spacing="0.3">CALIBRATION: 1 INCH = 25.4mm</text>
    <text x="-12" y="19" fill="#00AA00" font-size="1.8" letter-spacing="0.2">SCALE 1:1 — 1 unit = 1mm</text>

    <!-- File identification -->
    <text x="0" y="60" fill="#00AA00" font-size="2" letter-spacing="0.3">BLACK BADGE | 3mm ACRYLIC | 254 × 51mm | OLED: ER-OLEDM032-1Y (100.5 × 33.5mm)</text>
    <text x="0" y="65" fill="#00AA00" font-size="1.8" letter-spacing="0.2">NOTE: Verify OLED mounting holes against actual module before cutting. Hole positions are approximate.</text>
  </g>

</svg>

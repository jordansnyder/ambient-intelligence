<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="280mm" height="210mm"
     viewBox="0 -5 280 215"
     style="background: transparent;">

  <!-- ============================================ -->
  <!-- CONTROL SURFACE PANEL                        -->
  <!-- 280mm x 170mm  (~11" x 6.7")                -->
  <!-- Material: Smoked 3/16" (4.76mm) Acrylic      -->
  <!-- Potentiometers: P160 (TT Electronics/BI)     -->
  <!--   Bushing: M7xP0.75, shaft ø6.0mm           -->
  <!--   Panel hole: ø7.5mm                          -->
  <!--   Anti-rot slot: 3.5 x 2mm, 7.8mm from shaft -->
  <!-- Knobs: ~24.26mm diameter (US quarter)        -->
  <!-- SCALE: 1:1 — 1 viewBox unit = 1mm           -->
  <!-- ============================================ -->
  <!-- LAYER: CUT (RED #FF0000) — Through-cut       -->
  <!-- LAYER: ETCH-DEEP (BLUE #0000FF) — Engrave    -->
  <!-- ============================================ -->


  <!-- ========================================= -->
  <!-- === ETCH-DEEP LAYER (BLUE) - Graphics === -->
  <!-- ========================================= -->
  <g id="ETCH-DEEP" fill="#0000FF" stroke="none" font-family="'Courier New', monospace">

    <!-- ── HEADER ── -->
    <rect x="12" y="12" width="256" height="0.25"/>

    <text x="14" y="20" font-size="3.5" letter-spacing="1">ARC-2026-AI-___</text>
    <text x="266" y="20" font-size="2" letter-spacing="0.8" text-anchor="end" opacity="0.25">ΣΩ</text>

    <rect x="12" y="25" width="256" height="0.1" opacity="0.3"/>


    <!-- ── KNOB I ── -->
    <g transform="translate(42.5, 90)">
      <!-- 260° arc, r=16, dead zone at top -->
      <path d="M -12.26 -10.28 A 16 16 0 1 0 12.26 -10.28"
            fill="none" stroke="#0000FF" stroke-width="0.15" opacity="0.25"/>
      <!-- Endpoint dots -->
      <circle cx="-12.26" cy="-10.28" r="0.5" opacity="0.3"/>
      <circle cx="12.26" cy="-10.28" r="0.5" opacity="0.3"/>
      <!-- Center reference tick at 6 o'clock -->
      <line x1="0" y1="15" x2="0" y2="17.5" stroke="#0000FF" stroke-width="0.15" opacity="0.25"/>
      <!-- Label — centered between arc bottom (y≈16) and footer (y=65) -->
      <text x="0" y="40" font-size="3.2" letter-spacing="2" text-anchor="middle" opacity="0.45">I</text>
    </g>

    <!-- ── KNOB II ── -->
    <g transform="translate(107.5, 90)">
      <path d="M -12.26 -10.28 A 16 16 0 1 0 12.26 -10.28"
            fill="none" stroke="#0000FF" stroke-width="0.15" opacity="0.25"/>
      <circle cx="-12.26" cy="-10.28" r="0.5" opacity="0.3"/>
      <circle cx="12.26" cy="-10.28" r="0.5" opacity="0.3"/>
      <line x1="0" y1="15" x2="0" y2="17.5" stroke="#0000FF" stroke-width="0.15" opacity="0.25"/>
      <text x="0" y="40" font-size="3.2" letter-spacing="2" text-anchor="middle" opacity="0.45">II</text>
    </g>

    <!-- ── KNOB III ── -->
    <g transform="translate(172.5, 90)">
      <path d="M -12.26 -10.28 A 16 16 0 1 0 12.26 -10.28"
            fill="none" stroke="#0000FF" stroke-width="0.15" opacity="0.25"/>
      <circle cx="-12.26" cy="-10.28" r="0.5" opacity="0.3"/>
      <circle cx="12.26" cy="-10.28" r="0.5" opacity="0.3"/>
      <line x1="0" y1="15" x2="0" y2="17.5" stroke="#0000FF" stroke-width="0.15" opacity="0.25"/>
      <text x="0" y="40" font-size="3.2" letter-spacing="2" text-anchor="middle" opacity="0.45">III</text>
    </g>

    <!-- ── KNOB IV ── -->
    <g transform="translate(237.5, 90)">
      <path d="M -12.26 -10.28 A 16 16 0 1 0 12.26 -10.28"
            fill="none" stroke="#0000FF" stroke-width="0.15" opacity="0.25"/>
      <circle cx="-12.26" cy="-10.28" r="0.5" opacity="0.3"/>
      <circle cx="12.26" cy="-10.28" r="0.5" opacity="0.3"/>
      <line x1="0" y1="15" x2="0" y2="17.5" stroke="#0000FF" stroke-width="0.15" opacity="0.25"/>
      <text x="0" y="40" font-size="3.2" letter-spacing="2" text-anchor="middle" opacity="0.45">IV</text>
    </g>


    <!-- ── FOOTER ── -->
    <rect x="12" y="155" width="256" height="0.25"/>

    <!-- Scale ruler (50mm) -->
    <line x1="14" y1="148" x2="64" y2="148" stroke="#0000FF" stroke-width="0.1" opacity="0.2"/>
    <line x1="14" y1="146.5" x2="14" y2="149.5" stroke="#0000FF" stroke-width="0.1" opacity="0.2"/>
    <line x1="64" y1="146.5" x2="64" y2="149.5" stroke="#0000FF" stroke-width="0.1" opacity="0.2"/>
    <text x="14" y="153" font-size="1.1" opacity="0.15">0</text>
    <text x="55" y="153" font-size="1.1" opacity="0.15">50mm</text>

    <!-- Corner registration marks -->
    <line x1="2" y1="8" x2="2" y2="2" stroke="#0000FF" stroke-width="0.12"/>
    <line x1="2" y1="2" x2="8" y2="2" stroke="#0000FF" stroke-width="0.12"/>
    <line x1="272" y1="2" x2="278" y2="2" stroke="#0000FF" stroke-width="0.12"/>
    <line x1="278" y1="2" x2="278" y2="8" stroke="#0000FF" stroke-width="0.12"/>
    <line x1="2" y1="162" x2="2" y2="168" stroke="#0000FF" stroke-width="0.12"/>
    <line x1="2" y1="168" x2="8" y2="168" stroke="#0000FF" stroke-width="0.12"/>
    <line x1="278" y1="162" x2="278" y2="168" stroke="#0000FF" stroke-width="0.12"/>
    <line x1="272" y1="168" x2="278" y2="168" stroke="#0000FF" stroke-width="0.12"/>

  </g>


  <!-- ========================================= -->
  <!-- === CUT LAYER (RED) - Through cuts    === -->
  <!-- ========================================= -->
  <g id="CUT" fill="none" stroke="#FF0000" stroke-width="0.1">

    <!-- Outer panel boundary -->
    <rect x="0" y="0" width="280" height="170" rx="5" ry="5"/>

    <!-- Corner mounting holes (M4 = ø4.2mm) -->
    <circle cx="10" cy="10" r="2.1"/>
    <circle cx="270" cy="10" r="2.1"/>
    <circle cx="10" cy="160" r="2.1"/>
    <circle cx="270" cy="160" r="2.1"/>

    <!-- Mid-edge mounting holes (M4) -->
    <circle cx="140" cy="10" r="2.1"/>
    <circle cx="140" cy="160" r="2.1"/>

    <!-- P160 potentiometer shaft holes (ø7.5mm per panel layout) -->
    <!-- 4 pots, centered horizontally, 65mm spacing -->
    <circle cx="42.5" cy="90" r="3.75"/>
    <circle cx="107.5" cy="90" r="3.75"/>
    <circle cx="172.5" cy="90" r="3.75"/>
    <circle cx="237.5" cy="90" r="3.75"/>

    <!-- P160 anti-rotation tab slots (3.5 x 2mm, centered 7.8mm above shaft) -->
    <rect x="40.75" y="81.2" width="3.5" height="2" rx="0.3"/>
    <rect x="105.75" y="81.2" width="3.5" height="2" rx="0.3"/>
    <rect x="170.75" y="81.2" width="3.5" height="2" rx="0.3"/>
    <rect x="235.75" y="81.2" width="3.5" height="2" rx="0.3"/>

    <!-- Cable routing slot (bottom center) -->
    <rect x="125" y="164" width="30" height="6" rx="2"/>

  </g>


  <!-- === CALIBRATION REFERENCE (below cut boundary, 10mm gap) === -->
  <g fill="none" stroke="#00AA00" stroke-width="0.15" font-family="'Courier New', monospace">
    <rect x="10" y="180" width="25.4" height="25.4"/>
    <text x="10" y="177" fill="#00AA00" font-size="2.5" letter-spacing="0.3">CALIBRATION: 1 INCH = 25.4mm</text>
    <text x="40" y="192" fill="#00AA00" font-size="2" letter-spacing="0.2">SCALE 1:1 — 1 unit = 1mm</text>
    <text x="40" y="198" fill="#00AA00" font-size="2" letter-spacing="0.2">CONTROL SURFACE | 3/16" (4.76mm) SMOKED ACRYLIC | 280 × 170mm</text>
    <text x="40" y="204" fill="#00AA00" font-size="2" letter-spacing="0.2">POTS: P160 (TT Electronics) | SHAFT HOLE: ø7.5mm | ANTI-ROT SLOT: 3.5 × 2mm @ 7.8mm</text>
  </g>

</svg>
